<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlipTok - 選擇角色</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          sans-serif;
      }
      .role-container {
        max-width: 1200px;
        padding: 40px 20px;
      }
      .role-title {
        text-align: center;
        color: white;
        margin-bottom: 60px;
      }
      .role-title h1 {
        font-size: 48px;
        font-weight: 900;
        margin-bottom: 16px;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }
      .role-title p {
        font-size: 18px;
        opacity: 0.95;
      }
      .role-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 30px;
        max-width: 1000px;
        margin: 0 auto;
      }
      .role-card {
        background: white;
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }
      .role-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, #667eea, #764ba2);
        transform: scaleX(0);
        transition: transform 0.3s ease;
      }
      .role-card:hover::before {
        transform: scaleX(1);
      }
      .role-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
      }
      .role-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: white;
        transition: transform 0.3s ease;
      }
      .role-card:hover .role-icon {
        transform: scale(1.1) rotate(5deg);
      }
      .role-card.user .role-icon {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .role-card.brand .role-icon {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }
      .role-card.admin .role-icon {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      }
      .role-card h2 {
        font-size: 28px;
        font-weight: 800;
        color: #1e293b;
        margin-bottom: 12px;
      }
      .role-card p {
        font-size: 15px;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .role-features {
        text-align: left;
        margin-bottom: 24px;
        padding: 20px;
        background: #f8fafc;
        border-radius: 12px;
      }
      .role-feature {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        font-size: 14px;
        color: #334155;
      }
      .role-feature:last-child {
        margin-bottom: 0;
      }
      .role-feature i {
        color: #10b981;
        font-size: 16px;
        flex-shrink: 0;
      }
      .role-btn {
        width: 100%;
        padding: 16px 24px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 700;
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
      }
      .role-card.user .role-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .role-card.brand .role-btn {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      }
      .role-card.admin .role-btn {
        background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      }
      .role-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }
      @media (max-width: 768px) {
        .role-title h1 {
          font-size: 36px;
        }
        .role-cards {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="role-container">
      <div class="role-title">
        <h1>🚀 FlipTok</h1>
        <p>選擇你的角色開始體驗</p>
      </div>

      <div class="role-cards">
        <!-- 一般使用者 / 大使 -->
        <div
          class="role-card user"
          onclick="window.location.href='user-ambassador-index.html'"
        >
          <div class="role-icon">
            <i class="fas fa-users"></i>
          </div>
          <h2>使用者 / 大使</h2>
          <p>購物、創作、分享，成為品牌大使賺取收益</p>
          <div class="role-features">
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>瀏覽商品與購物</span>
            </div>
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>升級為品牌大使</span>
            </div>
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>創作影片賺取收益</span>
            </div>
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>查看數據分析</span>
            </div>
          </div>
          <button class="role-btn">
            進入用戶端
            <i class="fas fa-arrow-right" style="margin-left: 8px"></i>
          </button>
        </div>

        <!-- 店家 -->
        <div
          class="role-card brand"
          onclick="window.location.href='brand-index.html'"
        >
          <div class="role-icon">
            <i class="fas fa-store"></i>
          </div>
          <h2>品牌店家</h2>
          <p>管理品牌、審核大使內容、查看收益數據</p>
          <div class="role-features">
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>審核大使創作內容</span>
            </div>
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>與大使聊天互動</span>
            </div>
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>查看品牌收益報表</span>
            </div>
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>管理商品與促銷</span>
            </div>
          </div>
          <button class="role-btn">
            進入品牌後台
            <i class="fas fa-arrow-right" style="margin-left: 8px"></i>
          </button>
        </div>

        <!-- Admin -->
        <div
          class="role-card admin"
          onclick="window.location.href='admin-index.html'"
        >
          <div class="role-icon">
            <i class="fas fa-crown"></i>
          </div>
          <h2>平台管理員</h2>
          <p>管理平台、創建店家帳號、查看整體數據</p>
          <div class="role-features">
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>創建品牌店家帳號</span>
            </div>
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>管理所有品牌</span>
            </div>
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>查看平台整體收益</span>
            </div>
            <div class="role-feature">
              <i class="fas fa-check-circle"></i>
              <span>審核內容與用戶</span>
            </div>
          </div>
          <button class="role-btn">
            進入管理後台
            <i class="fas fa-arrow-right" style="margin-left: 8px"></i>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
